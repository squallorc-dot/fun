<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="../../ja/"><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/arcade.css?v=20261025.5">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061422}#arcade-root{height:100%;width:100%}#arcade-root .arcade-screen,#arcade-root .arcade-app{height:100%}#arcade-root .arcade-select{height:100%;overflow:auto;overscroll-behavior:contain}body .arcade-immersive{position:fixed;inset:0;z-index:1}</style>
</head><body data-page="play"><div id="arcade-root"></div>
<script>
window.dataLayer=[];
const originalPush=window.dataLayer.push.bind(window.dataLayer);
window.dataLayer.push=function(event){if(event&&event.event)parent.postMessage({source:'bio-city-shooter',event},location.origin);return originalPush(event)};
let guideWasPlaying=false;
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==parent||e.data?.source!=='bio-city-hub')return;
 if(e.data.command==='guide-pause'){const overlay=document.querySelector('#arcade-overlay');guideWasPlaying=e.data.resumeAfter===true||e.data.resumeAfter===undefined&&!!overlay&&overlay.hidden;if(overlay?.hidden)document.querySelector('[data-ar-command="pause"]')?.click();return;}
 if(e.data.command==='guide-resume'){if(guideWasPlaying){document.querySelector('[data-ar-command="resume"]')?.click();document.querySelector('canvas')?.focus({preventScroll:true});}guideWasPlaying=false;return;}
 if(e.data.command!=='start')return;
 const hero=Math.max(0,Math.min(6,Number(e.data.hero)||0));
 window.BioArcadeChapter=Math.max(1,Math.min(5,Number(e.data.chapter)||1));
 document.querySelector('[data-ar-hero="'+hero+'"]')?.click();
 const sel=document.querySelector('#arcade-difficulty');
 if(sel&&['normal','hard','expert'].includes(e.data.difficulty)){sel.value=e.data.difficulty;sel.dispatchEvent(new Event('change',{bubbles:true}));}
 const start=document.querySelector('[data-ar-command="start"]');
 if(!start){parent.postMessage({source:'bio-city-shooter',type:'error',reason:'start button missing'},location.origin);return;}
 start.click();
 parent.postMessage({source:'bio-city-shooter',type:'started'},location.origin);
});
document.addEventListener('click',e=>{if(e.target.closest('[data-ar-command="resume"]'))parent.postMessage({source:'bio-city-shooter',type:'resumed'},location.origin);});
window.addEventListener('load',()=>parent.postMessage({source:'bio-city-shooter',type:'ready'},location.origin),{once:true});
</script>
<script defer src="../arcade/assets/world-art.js?v=20261026.1"></script><script defer src="../arcade/assets/guardian-art.js?v=20261025.5"></script>
<script defer src="../assets/arcade-engine.js?v=20261026.1"></script>
</body></html>
