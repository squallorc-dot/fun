<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>守護者動作驗收｜開發用</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1829;color:#e1f4fc;font:15px system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:26px 20px}h1{font-size:26px;margin-bottom:6px}p{color:#a5becd;line-height:1.7}label,button,select,input{font:inherit}select,button{background:#233a50;border:1px solid #65839a;border-radius:7px;color:#eefaff;padding:10px}header{position:sticky;top:0;background:#0b1829f5;padding:10px 0;z-index:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap}input{max-width:160px}section{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{border:1px solid #345067;border-radius:14px;background:#14263a;overflow:hidden}article h2{font-size:16px;padding:0 14px}canvas{width:100%;display:block}small{display:block;padding:0 14px 12px;color:#94b2c7}@media(max-width:700px){section{grid-template-columns:repeat(2,1fr)}main{padding:18px 12px}h1{font-size:22px}}
</style></head><body><main><p>BIO-CITY ARCADE / DEVELOPMENT QA</p><h1>七組守護者・逐格動作驗收</h1><p>檢視同一套實際遊戲圖集的 12 類動作。正式站未發布；角色比例、技能演出與操作手感仍需驗收。</p><header><label>動作 <select id="clip"></select></label><button id="toggle">暫停</button><label>速度 <select id="speed"><option value="1">1×</option><option value=".5">0.5×</option><option value=".25">0.25×</option></select></label><label>逐格 <input id="frame" type="range" min="0" value="0" max="5"></label><span id="readout"></span></header><section id="heroes"></section><p>動畫命中幀共用遊戲設定；攻擊不會在起手時造成傷害。圖片由原創向量動作原稿產生，並非宣傳圖卡平移。來源：<a href="../assets/guardians/manifest.json" style="color:#8eeaff">圖集與時間表</a></p></main><script src="../assets/guardian-art.js?v=20261025.2"></script><script>
const art=BioGuardianArt,names=['Burner 姐','MJ 機器人','萌牛阿哞','葉寶 EX','果凍三兄妹','野菜小將','Oracle 守望者'],labels=['待機','移動','跳躍','落地','一段攻擊','二段攻擊','三段攻擊','受擊','閃避','專屬技能','倒地','勝利'],clip=document.querySelector('#clip'),slider=document.querySelector('#frame'),readout=document.querySelector('#readout');
Object.keys(art.clips).forEach((key,i)=>clip.add(new Option(labels[i]+' / '+key,key)));const cards=names.map((name,i)=>{const el=document.createElement('article');el.innerHTML='<h2>'+name+'</h2><canvas width="280" height="250"></canvas><small>12 類動作・71 格</small>';document.querySelector('#heroes').appendChild(el);const image=new Image();image.src='../assets/guardians/'+art.keys[i]+'.png';return {canvas:el.querySelector('canvas'),image}});
let playing=true,start=performance.now(),time=0;function reset(){start=performance.now();time=0;slider.max=art.clips[clip.value].frames-1;slider.value=0}clip.onchange=reset;document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'暫停':'播放';start=performance.now()-time*1000/Number(document.querySelector('#speed').value)};slider.oninput=()=>{playing=false;document.querySelector('#toggle').textContent='播放';time=Number(slider.value)/art.clips[clip.value].frames*art.clips[clip.value].duration};document.querySelector('#speed').onchange=reset;
function draw(now){const c=art.clips[clip.value];if(playing){time=(now-start)/1000*Number(document.querySelector('#speed').value)%c.duration;slider.value=Math.floor(time/c.duration*c.frames)}const frame=art.frameFor(clip.value,time);for(const {canvas,image}of cards){const ctx=canvas.getContext('2d');ctx.fillStyle='#14263a';ctx.fillRect(0,0,280,250);ctx.strokeStyle='#436078';ctx.beginPath();ctx.moveTo(20,219);ctx.lineTo(260,219);ctx.stroke();if(image.complete&&image.naturalWidth)ctx.drawImage(image,frame%8*160,Math.floor(frame/8)*160,160,160,20,8,240,240)}readout.textContent='FRAME '+(frame-c.offset+1)+' / '+c.frames+(c.hit?' · 命中 '+Math.round(c.hit*1000)+' ms':'');requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
