name = "bio-city-v161-signaling"
main = "worker.mjs"
compatibility_date = "2025-04-01"
workers_dev = false
preview_urls = false

[vars]
# Set explicitly before any deployment. Do not use wildcard origins.
ALLOWED_ORIGINS = "https://squallorc-dot.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "RATE_GATES"
class_name = "RateGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateGate"]
