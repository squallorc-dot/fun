name: v1.6.1 signaling prototype
on:
  pull_request:
    paths:
      - 'signaling/worker/**'
      - 'arcade/assets/friend-signaling.js'
      - 'arcade/assets/friend-invite.js'
      - 'arcade/assets/friend-lobby-auto.*'
      - 'arcade/assets/friend-lobby.js'
      - 'arcade/assets/g02-network.js'
      - 'arcade/assets/vendor/qrcode-generator*'
      - 'arcade/friends/**'
      - 'scripts/test-friend-ui-v161.mjs'
      - 'scripts/lib/signaling-test-server.mjs'
      - 'scripts/test-friend-invite-v161.cjs'
      - 'scripts/test-signaling-v161.mjs'
      - 'scripts/smoke-signaling-session-v161.mjs'
      - 'arcade/assets/friend-session.js'
      - 'arcade/assets/peer-link.js'
      - 'scripts/test-signaling-room-v161.mjs'
      - 'scripts/test-signaling-lifecycle-v161.cjs'
      - 'scripts/lib/friends-browser.mjs'
      - 'scripts/test-signaling-rate-v161.mjs'
      - 'scripts/test-signaling-test-gate-v161.mjs'
      - 'scripts/prepare-controlled-test-v161.mjs'
      - 'scripts/test-prepare-controlled-test-v161.mjs'
      - 'scripts/test-signaling-live-rate-v161.mjs'
      - 'scripts/test-signaling-live-ws-v161.cjs'
      - '.github/workflows/signaling-v161.yml'
permissions:
  contents: read
jobs:
  signaling-local-rtc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 wrangler@4.57.0 jsqr@1.4.0 ws@8.18.0
          npx playwright install --with-deps chromium
      - name: Test local Durable Object and real two-browser RTC
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --local --config signaling/worker/wrangler.toml --port 8787 --var ALLOWED_ORIGINS:http://127.0.0.1:8790 --var RATE_SECRET:LOCAL_ONLY_NOT_A_SECRET_0123456789abcdef --var TEST_ENABLED:true --var TEST_EXPIRES_AT:$(($(date +%s)+3600)) --var TEST_ALLOWED_IPS:192.0.2.1,198.51.100.1,203.0.113.1,203.0.113.2 --persist-to "$RUNNER_TEMP/v161-worker" > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8787/; then break; fi
            sleep 1
          done
          node scripts/test-friend-invite-v161.cjs
          node scripts/test-signaling-room-v161.mjs
          node scripts/test-signaling-lifecycle-v161.cjs
          node scripts/test-signaling-rate-v161.mjs
          node scripts/test-signaling-test-gate-v161.mjs
          node scripts/test-prepare-controlled-test-v161.mjs
          node scripts/test-signaling-live-rate-v161.mjs
          node scripts/test-signaling-live-ws-v161.cjs
          node scripts/test-friend-ui-v161.mjs
          node scripts/test-signaling-v161.mjs --rtc
          node scripts/smoke-signaling-session-v161.mjs
          BIO_AUTO_SIGNALING=1 node scripts/smoke-g01-friends-6b.mjs
          BIO_AUTO_SIGNALING=1 node scripts/smoke-g02-friends-6b.mjs
          BIO_AUTO_SIGNALING=1 node scripts/smoke-g06-friends-6c.mjs
