name: FUNAI CARE bilingual quality gate
on:
  push:
    branches: [main, development/bio-city-arcade-six-games]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify build and page structure
        run: node scripts/verify.mjs

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test bilingual layouts and user interactions
        run: |
          node scripts/smoke.mjs
          node scripts/smoke-arcade.mjs

  arcade-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate arcade modules and bilingual integration
        run: |
          node scripts/build.mjs --check
          node scripts/verify.mjs
          node scripts/verify-arcade.mjs
          node scripts/test-arcade-engines.cjs
