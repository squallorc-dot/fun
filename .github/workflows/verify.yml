name: FUNAI CARE bilingual quality gate
on:
  push:
    branches: [main, development/bio-city-arcade-six-games, release/bio-city-arcade-v1, release/guardians-ui-20261025, development/bio-city-arcade-v1-1-upgrade]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_evidence:
        description: Keep formal acceptance evidence for 30 days
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify build and page structure
        run: node scripts/verify.mjs

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test bilingual layouts and user interactions
        run: |
          node scripts/smoke.mjs
          node scripts/smoke-navigation.mjs
          node scripts/smoke-ost-persistent.mjs
          node scripts/smoke-arcade.mjs
          node scripts/smoke-challenge-6b.mjs
          node scripts/smoke-g02-core-6b.mjs
      - name: Verify existing direct WebRTC transport lab (two isolated browser contexts)
        run: node scripts/ci-browser-check.mjs scripts/smoke-p2p-v16.mjs
      - name: Test real two-browser G05 games and shared lobby
        run: node scripts/ci-browser-check.mjs scripts/smoke-friends-v16.mjs
      - name: Test G01 co-op and G05 switching over real RTC
        run: node scripts/ci-browser-check.mjs scripts/smoke-g01-friends-6b.mjs
      - name: Measure real multiplayer network conditions and prolonged play
        timeout-minutes: 45
        run: node scripts/ci-browser-check.mjs scripts/acceptance-friends-v16.mjs
      - name: Validate high latency matches and CDP resource lifecycle
        timeout-minutes: 40
        run: node scripts/ci-browser-check.mjs scripts/acceptance-friends-final-v16.mjs
      - name: Package byte-exact friends evidence with recoverable aliases
        if: always()
        run: python3 scripts/package-qa.py --output arcade/qa/artifact-v16/friends 'arcade/qa/friends-v16/results/'
      - name: Upload private multiplayer validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-city-friends-v16
          path: arcade/qa/artifact-v16/friends/
          compression-level: 9
          retention-days: 30

  arcade-session-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Install continuous recording tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test real media and startup / resume lifecycle
        run: node scripts/smoke-arcade-session.mjs
      - name: Test decoded sprites, full game controls and OST
        run: node scripts/ci-browser-check.mjs scripts/smoke-guardian-art.mjs scripts/smoke-arcade-visual.mjs scripts/smoke-arcade-audio.mjs scripts/smoke-arcade-art.mjs
      - name: Test genuine bilingual five-chapter campaign completions
        run: node scripts/ci-browser-check.mjs scripts/smoke-gameplay-campaign.mjs
      - name: Capture actual RC desktop and mobile game screenshots
        run: |
          node scripts/capture-arcade-rc.mjs
          node scripts/capture-arcade-visual.mjs
          node scripts/ci-browser-check.mjs scripts/capture-g06-sequences.mjs
      - name: Package byte-exact rc evidence with recoverable aliases
        if: always()
        run: python3 scripts/package-qa.py --output arcade/qa/artifact-v16/rc 'arcade/qa/rc-v1/*.png' 'arcade/qa/visual-v12/*.webp' 'arcade/qa/site-ui-v7/*.png' 'arcade/qa/art-v15/' 'arcade/qa/gameplay-v15/*.png' 'arcade/qa/gameplay-v15/*.json' 'arcade/qa/gameplay-v15/*.webm' 'arcade/qa/racing-v15/after/*.webm' 'arcade/qa/racing-v15/after/sequences.json' 'arcade/qa/racing-v15/after/c5-desktop/0020.png'
      - name: Upload release candidate visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-city-arcade-rc-screenshots
          path: arcade/qa/artifact-v16/rc/
          compression-level: 9
          retention-days: ${{ (job.status == 'failure' || github.ref == 'refs/heads/main' || inputs.acceptance_evidence == true) && 30 || 7 }}

  arcade-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate arcade modules and bilingual integration
        run: |
          node scripts/build.mjs --check
          node scripts/verify.mjs
          node scripts/verify-arcade.mjs
          node scripts/test-arcade-performance.cjs
          node scripts/test-arcade-session.cjs
          node scripts/test-arcade-controls.cjs
          node scripts/test-arcade-audio.cjs
          node scripts/test-arcade-grounding.cjs
          node scripts/test-arcade-engines.cjs
          node scripts/test-arcade-reliability.cjs
          node scripts/test-g06-race.cjs
          node scripts/test-g01-combat.cjs
          node scripts/test-g01-seven-skills.cjs
          node scripts/test-g01-animation.cjs
          node scripts/test-arcade-replay.cjs
          node scripts/test-arcade-campaign.cjs
          node scripts/test-arcade-chapters.cjs
          node scripts/test-g05-table.cjs
          node scripts/test-g05-volley.cjs
          node scripts/test-g05-multiplayer.cjs
          node scripts/test-challenge-6b.cjs
          node scripts/test-g01-coop-6b.cjs
          node scripts/test-g01-network-6b.cjs
          node scripts/test-g01-coop-fps-6b.cjs
          node scripts/test-g02-coop-6b.cjs
          node scripts/test-g02-coop-fps-6b.cjs
          node scripts/test-g02-bridge-coop-6b.cjs
          node scripts/test-friends-protocol.cjs
          python3 scripts/test-package-qa.py
          node scripts/test-arcade-sprites.cjs
          node scripts/test-g04-stages.cjs
          node scripts/test-g02-device-parity.cjs
          node scripts/test-g06-racing.cjs
          node scripts/test-arcade-art.cjs
          node scripts/test-gameplay-regressions.cjs
          node scripts/test-campaign-integrity.cjs
          node scripts/test-gameplay-matrix.cjs
          node scripts/test-g06-projection.cjs
          node scripts/test-g06-dynamics.cjs
          node scripts/test-g06-cup.cjs
          node scripts/test-g06-grid.cjs
          node scripts/test-g06-models-hud.cjs
          node scripts/test-g06-balance.cjs

      - name: Package byte-exact balance evidence with recoverable aliases
        if: always()
        run: python3 scripts/package-qa.py --output arcade/qa/artifact-v16/balance 'arcade/qa/racing-v15/balance/'
      - name: Upload seeded racing balance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-city-g06-balance-v15
          path: arcade/qa/artifact-v16/balance/
          compression-level: 9
          retention-days: ${{ (job.status == 'failure' || github.ref == 'refs/heads/main' || inputs.acceptance_evidence == true) && 30 || 7 }}

  arcade-controls-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test bilingual mobile control profiles and actual gameplay
        run: |
          node scripts/smoke-g02-mobile.mjs
          node scripts/smoke-arcade-controls.mjs
      - name: Package byte-exact controls evidence with recoverable aliases
        if: always()
        run: python3 scripts/package-qa.py --output arcade/qa/artifact-v16/controls 'arcade/qa/controls-v14/' 'arcade/qa/g02-mobile-v14/'
      - name: Upload controls evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-city-arcade-controls-v14
          path: arcade/qa/artifact-v16/controls/
          compression-level: 9
          retention-days: ${{ (job.status == 'failure' || github.ref == 'refs/heads/main' || inputs.acceptance_evidence == true) && 30 || 7 }}

  arcade-performance-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test low-FPS production loops, input ownership and cached pixels
        run: |
          node scripts/smoke-arcade-performance.mjs
          node scripts/smoke-g06-racing.mjs
      - name: Package byte-exact performance evidence with recoverable aliases
        if: always()
        run: python3 scripts/package-qa.py --output arcade/qa/artifact-v16/performance 'arcade/qa/performance-v14/' 'arcade/qa/g06-racing-v15/'
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-city-arcade-performance-v14
          path: arcade/qa/artifact-v16/performance/
          compression-level: 9
          retention-days: ${{ (job.status == 'failure' || github.ref == 'refs/heads/main' || inputs.acceptance_evidence == true) && 30 || 7 }}
