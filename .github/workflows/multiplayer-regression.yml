name: Bio-City multiplayer RTC regression (independent)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'arcade/assets/friend-*.js'
      - 'arcade/assets/peer-link.js'
      - 'arcade/assets/*network*.js'
      - 'arcade/friends/**'
      - 'signaling/**'
      - 'scripts/smoke-friends-v16.mjs'
      - 'scripts/smoke-g01-friends-6b.mjs'
      - 'scripts/smoke-g02-friends-6b.mjs'
      - 'scripts/smoke-g06-friends-6c.mjs'
      - 'scripts/smoke-friends-switch-v16.mjs'
      - 'scripts/smoke-p2p-v16.mjs'
      - 'scripts/smoke-g01-matrix-6b.mjs'
      - 'scripts/acceptance-friends*.mjs'
permissions:
  contents: read
jobs:
  live-rtc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify existing direct WebRTC transport lab (two isolated browser contexts)
        run: node scripts/ci-browser-check.mjs scripts/smoke-p2p-v16.mjs
      - name: Test real two-browser G05 games and shared lobby
        run: node scripts/ci-browser-check.mjs scripts/smoke-friends-v16.mjs
      - name: Test G01 co-op and G05 switching over real RTC
        run: node scripts/ci-browser-check.mjs scripts/smoke-g01-friends-6b.mjs
      - name: Test G02 co-op and G05 switching over real RTC
        timeout-minutes: 10
        run: node scripts/ci-browser-check.mjs scripts/smoke-g02-friends-6b.mjs
      - name: Test G06 racing over real RTC and lobby switching
        timeout-minutes: 10
        run: node scripts/ci-browser-check.mjs scripts/smoke-g06-friends-6c.mjs
      - name: Test all live games on one shared RTC connection
        timeout-minutes: 10
        run: node scripts/ci-browser-check.mjs scripts/smoke-friends-switch-v16.mjs
      - name: Compare G01 state across real RTC network conditions
        timeout-minutes: 20
        run: node scripts/ci-browser-check.mjs scripts/smoke-g01-matrix-6b.mjs
      - name: Measure real multiplayer network conditions and prolonged play
        timeout-minutes: 45
        run: node scripts/ci-browser-check.mjs scripts/acceptance-friends-v16.mjs
      - name: Validate high latency matches and CDP resource lifecycle
        timeout-minutes: 40
        run: node scripts/ci-browser-check.mjs scripts/acceptance-friends-final-v16.mjs
      - name: Package byte-exact friends evidence with recoverable aliases
        if: always()
        run: python3 scripts/package-qa.py --output arcade/qa/artifact-v16/friends 'arcade/qa/friends-v16/results/'
      - name: Upload private multiplayer validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-city-friends-v16
          path: arcade/qa/artifact-v16/friends/
          compression-level: 9
          retention-days: 30
