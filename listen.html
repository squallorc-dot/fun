<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,follow"><title>Bio-City｜連續 OST 播放模式</title><link rel="stylesheet" href="assets/ost-shell.css?v=20261025.12"></head>
<body><header id="persistent-dock" aria-label="連續播放音樂控制"><button type="button" id="persistent-expand" aria-controls="persistent-panel" aria-expanded="false" aria-label="開啟音樂控制">♫ OST</button></header><iframe id="bio-website" title="FUNAI CARE 守護者聯盟內容" allow="autoplay" loading="eager"></iframe>
<audio id="persistent-audio" preload="none"></audio>
<section id="persistent-panel" role="dialog" aria-label="OST 音樂設定" aria-hidden="true" hidden>
<h1 id="persistent-title">Bio-City OST</h1><label><span>OST</span><select id="persistent-track"></select></label>
<div class="ost-transport"><button id="persistent-prev" type="button" aria-label="上一首">⏮</button><button id="persistent-toggle" type="button">▶ PLAY</button><button id="persistent-next" type="button" aria-label="下一首">⏭</button></div>
<label class="ost-timeline"><span id="persistent-seek-label">播放進度</span><input id="persistent-progress" type="range" min="0" max="1000" value="0" step="1"><span id="persistent-clock">0:00 / --:--</span></label><label><span id="persistent-mode-label">播放模式</span><select id="persistent-mode"><option value="list">清單循環</option><option value="single">單曲循環</option><option value="shuffle">隨機播放</option></select></label>
<label><span>BGM</span><input id="persistent-volume" type="range" min="0" max="100" value="40"></label>
<p id="persistent-note"></p><button id="persistent-close" type="button">✕</button><button id="persistent-leave" type="button">離開連續模式</button>
</section><script defer src="assets/ost-shell.js?v=20261026.2"></script></body></html>
